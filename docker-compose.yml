networks:
  ecommerce-net:
    driver: bridge

volumes:
  server_node_modules:
  client_node_modules:

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecommerce-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    networks:
      - ecommerce-net
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    container_name: ecommerce-client
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    networks:
      - ecommerce-net
    restart: unless-stopped
    depends_on:
      - server
